# Gitea CI workflow for OpenTPS
# Mirrors .gitlab-ci.yml - keep in sync when upstream changes GitLab CI
# Runner labels: macos-latest, macos-arm64
# Uses brew's Python 3.12 (self-hosted runner)

name: CI

on:
  push:
    branches: [main, dev, 'feat/*', 'feature/*']
  pull_request:
    branches: [main, dev]

env:
  # Use brew's Python 3.12 on self-hosted macOS runner
  # Explicitly include standard system paths for git-submodule and other tools
  PATH: /opt/homebrew/opt/python@3.12/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
  PIP_CACHE_DIR: ~/Library/Caches/pip

jobs:
  version_check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Install and check versions
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          python3.12 --version
          pip install -e . -e opentps_core -e opentps_gui --no-deps
          pip install toml packaging
          python3.12 CI/check_version.py

  namespace_check:
    runs-on: macos-latest
    needs: version_check
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Check namespace packages
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install numpy
          # install with dependencies because tests relies on numpy (and whatever else is not lazy-loaded)
          pip install -e . -e opentps_core -e opentps_gui 
          python3.12 CI/tests.py

  test_core:
    runs-on: macos-latest
    needs: namespace_check
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Run core tests
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install -e . -e opentps_core -e opentps_gui 
          pip install pytest pytest-cov
          pytest opentps_core/tests/ -v --tb=short

  test_gui:
    runs-on: macos-latest
    needs: test_core
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Run GUI tests
        env:
          QT_QPA_PLATFORM: "offscreen"
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install -e . -e opentps_core -e opentps_gui 
          pip install pytest pytest-cov
          python3.12 -c "from PyQt5 import QtWidgets; app = QtWidgets.QApplication([]); print('PyQt initialization successful')"
          pytest opentps_gui/tests/ -v --tb=short

  test_legacy_core:
    runs-on: macos-latest
    needs: test_gui
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Run legacy embedded core tests
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install -e . -e opentps_core -e opentps_gui
          pip install pytest
          pytest --pyargs \
            opentps.core.io.mcsquareIO \
            opentps.core.data._patientData \
            opentps.core.data._patient \
            opentps.core.data._patientList \
            opentps.core.data.plan._planProtonBeam \
            opentps.core.data.plan._planPhotonSegment \
            opentps.core.data.plan._protonPlan \
            opentps.core.data.plan._planProtonLayer \
            -v --tb=short

  test_legacy_gui:
    runs-on: macos-latest
    needs: test_gui
    # macOS Qt offscreen plugin segfaults on ViewController/OpenGL initialization.
    # The legacy GUI test (opentps.gui.main.MainTestCase) runs on Linux (GitLab CI).
    if: false
    # continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Run legacy embedded GUI tests
        env:
          QT_QPA_PLATFORM: "offscreen"
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install -e . -e opentps_core -e opentps_gui
          pip install pytest
          pytest --pyargs opentps.gui.main -v --tb=short

  docs:
    runs-on: macos-latest
    needs: version_check
    if: false
    # if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache pip packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml', '**/uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      - name: Build docs
        run: |
          python3.12 -m venv .venv
          source .venv/bin/activate
          pip install -e . -e opentps_core -e opentps_gui 
          pip install sphinx sphinx-rtd-theme sphinx-pyreverse
          cd docs
          make html
